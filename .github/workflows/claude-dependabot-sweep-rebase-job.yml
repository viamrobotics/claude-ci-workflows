name: Claude Dependabot Sweep Rebase Job (Reusable, Internal)

# Internal reusable workflow that performs the rebase of a single Dependabot
# sweep PR. Not intended to be called directly by external repos — it is
# orchestrated by:
#   - claude-dependabot-sweep.yml (auto-rebase path: matrix calls this once per
#     conflicting sweep PR)
#   - claude-dependabot-sweep-rebase.yml (comment-triggered: a single PR)
#
# Flow:
#   1. Reset the PR's branch to the default branch HEAD.
#   2. Try to replay the original manifest patch deterministically; regenerate
#      the lockfile via install_command.
#   3. If the manifest patch can't apply (rare), fall back to Claude with the
#      same prompt shape as the sweep's fix path.
#   4. Workflow handles git/PR side-effects (commit, force-push, comment,
#      close PR if no changes are needed).

on:
  workflow_call:
    inputs:
      # --- PR identification (required) ---
      package:
        description: 'Package name being rebased (e.g., golang.org/x/net)'
        required: true
        type: string
      severity:
        description: 'Highest advisory severity for this package (critical|high|medium|low)'
        required: true
        type: string
      issue_number:
        description: 'Linked tracking issue number'
        required: true
        type: string
      pr_number:
        description: 'Pull request number being rebased'
        required: true
        type: string
      head_ref:
        description: 'Branch name of the PR being rebased'
        required: true
        type: string
      head_sha:
        description: 'Expected head SHA of the PR (used for --force-with-lease)'
        required: true
        type: string
      # --- Behavior (required) ---
      allowed_tools:
        description: 'Allowed tools string for claude-code-action (Claude fallback only)'
        required: true
        type: string
      # --- Behavior (optional) ---
      install_command:
        description: 'Command to install dependencies before the Claude fallback runs (sets up Claude''s working environment)'
        required: false
        type: string
        default: ''
      extra_prompt:
        description: 'Extra instructions appended to the Claude fallback user prompt'
        required: false
        type: string
        default: ''
      extra_system_prompt:
        description: 'Extra instructions appended to the Claude fallback system prompt'
        required: false
        type: string
        default: ''
      model:
        description: 'Claude model to use for the fallback'
        required: false
        type: string
        default: 'claude-opus-4-6'
      max_turns:
        description: 'Max conversation turns for the Claude fallback'
        required: false
        type: number
        default: 75
      show_full_output:
        description: 'Show full JSON output from Claude Code. WARNING: may expose secrets in logs.'
        required: false
        type: boolean
        default: false
      container:
        description: 'Container image for the rebase job. Leave empty for bare runner.'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      CI_GITHUB_APP_ID:
        required: true
      CI_GITHUB_APP_PRIVATE_KEY:
        required: true
      SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL:
        required: false
      AUTH_TEST_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  rebase:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    container: ${{ inputs.container || '' }}
    steps:
      # The actual rebase logic lives in a composite action so it can be shared
      # with the sweep's auto-rebase fan-out, which must run from a normal
      # matrix job (a reusable-workflow `uses:` job cannot take a needs-derived
      # matrix). This reusable workflow remains the entry point for the
      # comment-triggered single-PR path (claude-dependabot-sweep-rebase.yml).
      - name: Rebase ${{ inputs.package }}
        uses: viamrobotics/claude-ci-workflows/.github/actions/dependabot-sweep-rebase@main
        with:
          package: ${{ inputs.package }}
          severity: ${{ inputs.severity }}
          issue_number: ${{ inputs.issue_number }}
          pr_number: ${{ inputs.pr_number }}
          head_ref: ${{ inputs.head_ref }}
          head_sha: ${{ inputs.head_sha }}
          allowed_tools: ${{ inputs.allowed_tools }}
          install_command: ${{ inputs.install_command }}
          extra_prompt: ${{ inputs.extra_prompt }}
          extra_system_prompt: ${{ inputs.extra_system_prompt }}
          model: ${{ inputs.model }}
          max_turns: ${{ inputs.max_turns }}
          show_full_output: ${{ inputs.show_full_output }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          app_id: ${{ secrets.CI_GITHUB_APP_ID }}
          app_private_key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          slack_webhook_url: ${{ secrets.SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL }}
          auth_test_credentials: ${{ secrets.AUTH_TEST_CREDENTIALS }}
