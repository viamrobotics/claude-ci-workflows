name: Claude PR Fix (Reusable)

# Applies fixes to a PR when triggered by @claude-fix in a PR comment.
# Pushes code to the PR branch — this is NOT a read-only review.
#
# Callers handle issue_comment / pull_request_review_comment triggers.
# The github context is inherited from the caller, so trigger_phrase works correctly.

on:
  workflow_call:
    inputs:
      # --- Required ---
      allowed_tools:
        description: 'Allowed tools string for claude-code-action (must include write tools)'
        required: true
        type: string
      # --- Optional ---
      install_command:
        description: 'Command to install dependencies (e.g., "npm ci" or "make install")'
        required: false
        type: string
        default: ''
      extra_prompt:
        description: 'Extra instructions appended to the Claude prompt (user message)'
        required: false
        type: string
        default: ''
      extra_system_prompt:
        description: 'Extra instructions appended to the CI system prompt file'
        required: false
        type: string
        default: ''
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-sonnet-4-6'
      max_turns:
        description: 'Max conversation turns'
        required: false
        type: number
        default: 30
      show_full_output:
        description: 'Show full JSON output from Claude Code. WARNING: may expose secrets in logs.'
        required: false
        type: boolean
        default: false
      repository_owner:
        description: 'Expected repository owner for guard condition'
        required: false
        type: string
        default: 'viamrobotics'
    secrets:
      # Set at viamrobotics org level. Key: claude_code_key_jira_github_action
      # in the Internal Usage Workspace on Claude Console.
      ANTHROPIC_API_KEY:
        required: true
      GIT_ACCESS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  pr-fix:
    if: github.repository_owner == inputs.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.setFailed('pr-fix only works on pull request comments.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              core.setOutput('ref', pr.head.ref);
              core.setOutput('pr_number', String(pr.number));
            } else {
              core.setOutput('ref', context.payload.pull_request.head.ref);
              core.setOutput('pr_number', String(context.payload.pull_request.number));
            }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 1
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Resolve reusable workflow ref
        id: workflow-ref
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: echo "ref=${WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout CI prompts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: viamrobotics/claude-ci-workflows
          ref: ${{ steps.workflow-ref.outputs.ref }}
          path: .ci-prompts
          sparse-checkout: prompts/
          sparse-checkout-cone-mode: false

      - name: Assemble CI system prompt
        env:
          EXTRA_SYSTEM_PROMPT: ${{ inputs.extra_system_prompt }}
        run: |
          echo "You are fixing a pull request based on reviewer feedback. Be precise and make minimal changes." > /tmp/ci-system-prompt.md
          echo "" >> /tmp/ci-system-prompt.md
          cat .ci-prompts/prompts/ci-common.md >> /tmp/ci-system-prompt.md
          if [ -n "$EXTRA_SYSTEM_PROMPT" ]; then
            printf '\n%s\n' "$EXTRA_SYSTEM_PROMPT" >> /tmp/ci-system-prompt.md
          fi
          {
            echo "APPEND_SYSTEM_PROMPT<<__CI_PROMPT_EOF__"
            cat /tmp/ci-system-prompt.md
            echo "__CI_PROMPT_EOF__"
          } >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@0cf5eeec4f908121edd03a81411b55485994f8d3 # v1.0.54
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: ${{ inputs.show_full_output }}
          settings: .claude/settings.ci.json
          trigger_phrase: "@claude-fix"
          track_progress: true
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ steps.pr.outputs.pr_number }} on branch `${{ steps.pr.outputs.ref }}`

            You are a senior engineer fixing a pull request based on the commenter's instructions.
            Read their comment carefully — it describes exactly what they want changed.

            ## Setup

            1. Read CLAUDE.md for repository conventions and constraints.
            2. Read every modified file in full to understand the current PR state.
            3. Run `git diff origin/main...HEAD` to see the full set of PR changes.

            ## Instructions

            - Focus on the specific changes requested in the comment.
            - Make minimal, targeted fixes that follow existing codebase conventions.
            - After making changes, run any relevant linters or tests to verify correctness.
            - Commit and push your changes to the PR branch.
            - Post a brief summary of what you changed as a PR comment.
            ${{ inputs.extra_prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"
