name: Claude GitHub Issue Implementation (Reusable)

# Implements a GitHub issue using Claude Code Action.
# Creates a branch with claude/ prefix, opens a PR, notifies Slack on failure.
#
# Callers handle triggers (issues opened/labeled) and pass issue data directly.

on:
  workflow_call:
    inputs:
      # --- Required ---
      issue_number:
        description: 'GitHub issue number'
        required: true
        type: number
      title:
        description: 'Issue title'
        required: true
        type: string
      body:
        description: 'Issue body/description'
        required: true
        type: string
      allowed_tools:
        description: 'Allowed tools string for claude-code-action'
        required: true
        type: string
      issue_author:
        description: 'GitHub username of the issue reporter (assigned to the resulting PR)'
        required: false
        type: string
        default: ''
      # --- Optional ---
      install_command:
        description: 'Command to install dependencies (e.g., "npm ci" or "make install")'
        required: false
        type: string
        default: ''
      extra_prompt:
        description: 'Extra instructions appended to the Claude prompt (user message)'
        required: false
        type: string
        default: ''
      extra_system_prompt:
        description: 'Extra instructions appended to the CI system prompt file'
        required: false
        type: string
        default: ''
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-opus-4-6'
      task_complexity:
        description: 'Task complexity: small (50 turns), medium (75), large (100). Ignored if max_turns is set.'
        required: false
        type: string
        default: 'small'
      max_turns:
        description: 'Max conversation turns (overrides task_complexity if > 0)'
        required: false
        type: number
        default: 0
      show_full_output:
        description: 'Show full JSON output from Claude Code. WARNING: may expose secrets in logs.'
        required: false
        type: boolean
        default: false
      repository_owner:
        description: 'Expected repository owner for guard condition'
        required: false
        type: string
        default: 'viamrobotics'
      container:
        description: 'Container image for the implement job (e.g., "ubuntu:22.04"). Leave empty for bare runner.'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL:
        required: false
      AUTH_TEST_CREDENTIALS:
        required: false
      # Optional: when set, a fresh app token is minted to open the PR (avoids a
      # 401 from reusing the Claude action's OIDC token, and triggers downstream
      # CI on the PR). Without it, the PR is opened with the default job token.
      CI_GITHUB_APP_ID:
        required: false
      CI_GITHUB_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      max_turns: ${{ steps.resolve.outputs.max_turns }}
    steps:
      - name: Map task complexity to max turns
        id: resolve
        env:
          MAX_TURNS: ${{ inputs.max_turns }}
          COMPLEXITY: ${{ inputs.task_complexity }}
        run: |
          if [ "$MAX_TURNS" -gt 0 ] 2>/dev/null; then
            echo "max_turns=$MAX_TURNS" >> "$GITHUB_OUTPUT"
          else
            case "$COMPLEXITY" in
              medium) echo "max_turns=150" >> "$GITHUB_OUTPUT" ;;
              large)  echo "max_turns=200" >> "$GITHUB_OUTPUT" ;;
              *)      echo "max_turns=100" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  implement:
    needs: resolve-inputs
    if: github.repository_owner == inputs.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    container: ${{ inputs.container || '' }}
    env:
      # Whether the caller wired up the CI app for fresh PR-creation tokens.
      # Gated here (not in a step `if`) because secrets aren't readable in `if`.
      HAS_CI_APP: ${{ secrets.CI_GITHUB_APP_ID != '' && secrets.CI_GITHUB_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Comment on issue that implementation is starting
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `🤖 Claude is starting work on this issue. [Follow progress](${process.env.RUN_URL})`,
            });

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Checkout CI prompts and scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: viamrobotics/claude-ci-workflows
          ref: main
          path: .ci-prompts
          sparse-checkout: |
            prompts/
            scripts/
          sparse-checkout-cone-mode: false

      - name: Assemble CI system prompt
        env:
          SYSTEM_PROMPT_PREAMBLE: "Before modifying any file, explore the relevant code first."
          EXTRA_SYSTEM_PROMPT: ${{ inputs.extra_system_prompt }}
        run: .ci-prompts/scripts/assemble-system-prompt.sh

      - id: claude
        uses: anthropics/claude-code-action@26ddc358fe3befff50c5ec2f80304c90c763f6f8 # v1.0.90
        env:
          AUTH_TEST_CREDENTIALS: ${{ secrets.AUTH_TEST_CREDENTIALS }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: ${{ inputs.show_full_output }}
          display_report: true
          settings: .claude/settings.ci.json
          prompt: |
            Implement the following GitHub issue:

            Issue: #${{ inputs.issue_number }}
            Title: ${{ inputs.title }}
            Description:
            ${{ inputs.body }}

            Instructions:
            - Read CLAUDE.md for repository conventions.
            - Add or update unit tests for changed behavior.
            - Branch name MUST start with `claude/` prefix.
            - Before creating a branch, committing, or pushing, run `git status --porcelain`. If the output is empty, do NOT create a branch — comment on issue #${{ inputs.issue_number }} explaining why no changes were needed and stop.
            - When you open the PR (see "Opening a PR" in your instructions), the title should include the issue reference, e.g. `feat: implement feature (#${{ inputs.issue_number }})`, and the body must link the issue with `Closes #${{ inputs.issue_number }}`.
            ${{ inputs.issue_author != '' && format('- In /tmp/pr-body.txt, include a "DRI" section: **@{0}** is the responsible engineer for this PR.', inputs.issue_author) || '' }}
            ${{ inputs.extra_prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ needs.resolve-inputs.outputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"

      # Keep the execution log so no-PR outcomes are debuggable after teardown.
      - name: Upload Claude execution output
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: claude-execution-output
          # Use the action's output path; fall back to the temp location
          # (container-safe). A blank line is skipped if the output is empty.
          path: |
            ${{ steps.claude.outputs.execution_file }}
            ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 7

      # Mint a fresh app token for opening the PR. Reusing the token the Claude
      # action minted via OIDC (steps.claude.outputs.github_token) is unreliable:
      # after a long agent run it can be rejected by the API with a 401 "Bad
      # credentials". A token minted here is fresh, and — being an app token, not
      # the default GITHUB_TOKEN — the PR it opens still triggers downstream CI.
      # Skipped when the caller hasn't configured the CI app (see secrets); the
      # Open PR step then falls back to the job token.
      - name: Generate token for PR creation
        id: pr-token
        if: steps.claude.outcome == 'success' && env.HAS_CI_APP == 'true'
        # actions/create-github-app-token@v2.2.1
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        with:
          app-id: ${{ secrets.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}

      # Open the PR deterministically: the agent pushes the branch and writes
      # the title/body to /tmp; it never runs `gh pr create` (the Bash matcher
      # rejects multi-line args). Uses github-script (not gh) so it works in
      # caller-provided containers where gh is not installed.
      - name: Open PR
        id: open-pr
        if: steps.claude.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
        with:
          # Fresh app token when the CI app is configured (see "Generate token
          # for PR creation"); otherwise the default job token.
          github-token: ${{ steps.pr-token.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/pr-title.txt')) {
              core.info('No /tmp/pr-title.txt: agent did not request a PR.');
              return;
            }
            // Determine the PR branch. The agent creates it itself
            // (git checkout -b claude/...), so the action's branch_name output
            // is empty here. Prefer the name the agent recorded in
            // /tmp/pr-branch.txt; then the action output; then, as a last
            // resort, the HEAD the agent left checked out.
            let branch = fs.existsSync('/tmp/pr-branch.txt')
              ? fs.readFileSync('/tmp/pr-branch.txt', 'utf8').trim() : '';
            if (!branch) {
              branch = process.env.BRANCH_NAME;
            }
            if (!branch) {
              const head = await exec.getExecOutput(
                'git', ['rev-parse', '--abbrev-ref', 'HEAD'],
                { silent: true, ignoreReturnCode: true });
              branch = head.stdout.trim();
            }
            if (!branch || branch === 'HEAD') {
              core.setFailed('Could not determine the PR branch: no /tmp/pr-branch.txt, no branch_name output, and git HEAD is detached.');
              return;
            }
            const title = fs.readFileSync('/tmp/pr-title.txt', 'utf8').trim();
            const body = fs.existsSync('/tmp/pr-body.txt')
              ? fs.readFileSync('/tmp/pr-body.txt', 'utf8') : '';
            const { owner, repo } = context.repo;
            const base = (await github.rest.repos.get({ owner, repo })).data.default_branch;
            // Idempotent on re-runs: reuse an open PR for this exact branch.
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });
            const pr = existing.data[0]
              || (await github.rest.pulls.create({ owner, repo, head: branch, base, title, body })).data;
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_number', String(pr.number));
            core.info(`PR: ${pr.html_url}`);

      - name: Assign issue reporter to PR
        if: inputs.issue_author != '' && steps.open-pr.outputs.pr_number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
          PR_NUMBER: ${{ steps.open-pr.outputs.pr_number }}
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              assignees: [process.env.ISSUE_AUTHOR],
            });
            core.info(`Assigned ${process.env.ISSUE_AUTHOR} to PR #${process.env.PR_NUMBER}`);

      - name: Comment result on issue
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          PR_URL: ${{ steps.open-pr.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const outcome = process.env.CLAUDE_OUTCOME;
            const prUrl = process.env.PR_URL;
            const runUrl = process.env.RUN_URL;
            let body;
            if (outcome !== 'success') {
              body = `❌ Claude failed to implement this issue. [View logs](${runUrl})`;
            } else if (prUrl) {
              body = `✅ Claude opened a PR for this issue: ${prUrl}`;
            } else {
              body = `⚠️ Claude completed but did not open a PR. This may mean the issue requires manual intervention or Claude could not determine a code change. [View logs](${runUrl})`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });

      - name: Notify Slack of failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Claude GitHub issue implementation failed for ${{ github.repository }} #${{ inputs.issue_number }}: ${{ inputs.title }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL }}
