name: PR Title

# Squash-merge uses the PR title as the commit subject, and release-please
# classifies the release from its conventional-commit type. Enforce the
# convention before merge so a non-conventional title can't skip the release.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # amannn/action-semantic-pull-request@v6.1.1
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
