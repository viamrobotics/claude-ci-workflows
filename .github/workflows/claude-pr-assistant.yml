name: Claude PR Assistant (Reusable)

# Triggered by @claude mention in PR comments or reviews.
# Handles any request: review, fix, refactor, explain, etc.
# If GIT_ACCESS_TOKEN is provided and allowed_tools includes write tools,
# Claude can make changes and push to the PR branch.
#
# Callers handle issue_comment / pull_request_review_comment / pull_request_review triggers.
# For pull_request_review, callers choose types: [submitted] and/or [edited].
# The github context is inherited from the caller, so trigger_phrase works correctly.

on:
  workflow_call:
    inputs:
      # --- Required ---
      allowed_tools:
        description: 'Allowed tools string for claude-code-action'
        required: true
        type: string
      # --- Optional ---
      install_command:
        description: 'Command to install dependencies (e.g., "npm ci" or "make install")'
        required: false
        type: string
        default: ''
      extra_review_instructions:
        description: 'Extra language-specific review instructions'
        required: false
        type: string
        default: ''
      extra_system_prompt:
        description: 'Extra instructions appended to the CI system prompt file'
        required: false
        type: string
        default: ''
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-sonnet-4-6'
      max_turns:
        description: 'Max conversation turns'
        required: false
        type: number
        default: 75
      show_full_output:
        description: 'Show full JSON output from Claude Code. WARNING: may expose secrets in logs.'
        required: false
        type: boolean
        default: false
      repository_owner:
        description: 'Expected repository owner for guard condition'
        required: false
        type: string
        default: 'viamrobotics'
      container:
        description: 'Container image for the job (e.g., "ubuntu:22.04"). Leave empty for bare runner.'
        required: false
        type: string
        default: ''
    secrets:
      # Set at viamrobotics org level. Key: claude_code_key_jira_github_action
      # in the Internal Usage Workspace on Claude Console.
      ANTHROPIC_API_KEY:
        required: true
      AUTH_TEST_CREDENTIALS:
        required: false
      GIT_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  resolve-context:
    # Always skip bot-authored reviews to prevent infinite loops between
    # auto-review and this workflow.
    if: >-
      github.repository_owner == inputs.repository_owner &&
      (
        github.event_name != 'pull_request_review' ||
        github.event.review.user.type != 'Bot'
      )
    permissions:
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.setFailed('Skipping: comment is on an issue, not a pull request.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              core.setOutput('ref', pr.head.ref);
              core.setOutput('pr_number', String(pr.number));
            } else {
              core.setOutput('ref', context.payload.pull_request.head.ref);
              core.setOutput('pr_number', String(context.payload.pull_request.number));
            }

      # Fetch review comments when triggered by a pull_request_review event.
      # The action receives the top-level review body, but line-level comments
      # need to be fetched separately and passed via artifact.
      - name: Get review comments
        if: github.event_name == 'pull_request_review'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const reviewId = context.payload.review.id;
            const prNumber = context.payload.pull_request.number;

            let output = `## Review Summary\n`;
            output += `State: ${context.payload.review.state}\n`;
            output += `${context.payload.review.body || '(no body)'}\n\n`;

            const { data: comments } = await github.rest.pulls.listCommentsForReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              review_id: reviewId
            });

            if (comments.length > 0) {
              output += `## Line Comments\n`;
              for (const c of comments) {
                const line = c.line || c.original_line || '?';
                output += `\n### ${c.path}:${line}\n`;
                if (c.start_line) {
                  output += `(lines ${c.start_line}-${line})\n`;
                }
                output += `${c.body}\n`;
              }
            }

            fs.writeFileSync('/tmp/review-comments.txt', output);

      - name: Upload review comments
        if: github.event_name == 'pull_request_review'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: review-comments
          path: /tmp/review-comments.txt
          retention-days: 1

      # Fetch failure logs on this bare runner (not inside the caller's
      # container) so that the gh CLI is always available.
      # Logs are uploaded as an artifact and downloaded in on-demand-review to avoid
      # ARG_MAX limits when passing large logs through job outputs / env vars.
      - name: Get failure logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.pr.outputs.ref }}
        run: |
          set -euo pipefail
          RESOLVED_RUN_ID=$(gh run list \
            --branch "$PR_BRANCH" \
            --repo "$GH_REPO" \
            --status failure \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -z "$RESOLVED_RUN_ID" ]; then
            echo "No recent CI failures found." > /tmp/failure-logs.txt
            exit 0
          fi
          LOGS=$(gh run view "$RESOLVED_RUN_ID" --repo "$GH_REPO" --log-failed 2>&1 | tail -500) || true
          if [ -z "$LOGS" ]; then
            LOGS=$(gh run view "$RESOLVED_RUN_ID" --repo "$GH_REPO" --log 2>&1 | tail -500) || true
          fi
          if [ -z "$LOGS" ]; then
            LOGS="No recent CI failures found."
          fi
          # Sanitize GitHub Actions log markers
          LOGS="${LOGS//##\[/\[}"
          echo "$LOGS" > /tmp/failure-logs.txt

      - name: Upload failure logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: failure-logs
          path: /tmp/failure-logs.txt
          retention-days: 1

  pr-assistant:
    needs: resolve-context
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    container: ${{ inputs.container || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-context.outputs.ref }}
          fetch-depth: 1
          token: ${{ secrets.GIT_ACCESS_TOKEN || github.token }}

      - name: Download failure logs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: failure-logs
          path: /tmp

      - name: Download review comments
        if: github.event_name == 'pull_request_review'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: review-comments
          path: /tmp

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Checkout CI prompts and scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: viamrobotics/claude-ci-workflows
          ref: main
          path: .ci-prompts
          sparse-checkout: |
            prompts/
            scripts/
          sparse-checkout-cone-mode: false

      - name: Assemble CI system prompt
        env:
          SYSTEM_PROMPT_PREAMBLE: "You are a demanding code reviewer. Provide thorough, actionable feedback. If the commenter asks you to make changes and you have write tools available, you may edit, commit, and push code."
          EXTRA_SYSTEM_PROMPT: ${{ inputs.extra_system_prompt }}
        run: .ci-prompts/scripts/assemble-system-prompt.sh

      - uses: anthropics/claude-code-action@0cf5eeec4f908121edd03a81411b55485994f8d3 # v1.0.54
        env:
          AUTH_TEST_CREDENTIALS: ${{ secrets.AUTH_TEST_CREDENTIALS }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: ${{ inputs.show_full_output }}
          settings: .claude/settings.ci.json
          trigger_phrase: "@claude"
          track_progress: true
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ needs.resolve-context.outputs.pr_number }} on branch `${{ needs.resolve-context.outputs.ref }}`
            TRIGGER: ${{ github.event_name }}

            Read the triggering comment carefully — it describes
            exactly what the commenter wants. You can review code, make fixes, or both depending
            on what is asked.

            ## Setup

            1. Read CLAUDE.md for repository conventions and constraints.
            2. Read every modified file in full to understand context beyond the diff.
            3. Run `git diff origin/main...HEAD` to see the full set of PR changes.

            ## Review Comments

            If TRIGGER is `pull_request_review`, read `/tmp/review-comments.txt` for the full
            review context including line-level comments on specific files. Address all review
            feedback, not just the top-level summary.

            ## CI Failure Logs

            If the commenter is asking you to fix CI failures, read the logs from `/tmp/failure-logs.txt` to diagnose the issue.

            ## Review Checklist

            When reviewing (not just fixing), check for:

            **Correctness**
            - Trace the logic end-to-end. Look for off-by-one errors, null/undefined handling, and incorrect type narrowing.
            - Verify error handling paths: are errors caught, propagated, or silently swallowed?
            - Check boundary conditions and edge cases.

            **Security**
            - Check for injection risks (command injection, prototype pollution).
            - Verify no secrets, credentials, or internal URLs are hardcoded.

            **API Design & Backwards Compatibility**
            - If the public API surface changed, verify it is backwards-compatible.
            - Check naming consistency with existing APIs.

            **Patterns & Conventions**
            - Verify the PR does not introduce new abstractions or patterns that diverge from existing code.
            - Check that the change is minimal.

            **Tests**
            - Verify tests exist for the changed behavior.
            - Tests should cover edge cases and error paths.

            ## Actions

            - If the commenter asks you to make changes or fix something, edit the code, commit, and push to the PR branch. Post a brief summary of what you changed.
            - If the commenter only asks for a review or feedback, do NOT push code.
            - For ANY line-specific feedback (bugs, style issues, nits), you MUST use `mcp__github_inline_comment__create_inline_comment` to post an inline comment on the exact file and line. Do NOT put line-specific feedback only in the summary.
            - For trivial fixes (whitespace, typos, formatting), include a GitHub suggestion block in the inline comment so the author can apply it with one click:
              ```suggestion
              corrected line here
              ```
            - Post your review summary organized by severity. The summary should reference inline comments for details, not duplicate line-level feedback.
            - If the commenter included specific instructions alongside @claude, focus on those areas first.
            ${{ inputs.extra_review_instructions }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"
