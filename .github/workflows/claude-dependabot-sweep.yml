name: Claude Dependabot Sweep (Reusable)

# Groups open Dependabot alerts by package, creates one GitHub issue per package,
# then runs Claude in parallel to fix each package and open a separate PR.
#
# Callers handle triggers (schedule, workflow_dispatch) and pass configuration.

on:
  workflow_call:
    inputs:
      # --- Required ---
      allowed_tools:
        description: 'Allowed tools string for claude-code-action'
        required: true
        type: string
      # --- Optional ---
      install_command:
        description: 'Command to install dependencies (e.g., "npm ci" or "make install")'
        required: false
        type: string
        default: ''
      extra_prompt:
        description: 'Extra instructions appended to the Claude prompt (user message)'
        required: false
        type: string
        default: ''
      extra_system_prompt:
        description: 'Extra instructions appended to the system prompt'
        required: false
        type: string
        default: ''
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-opus-4-6'
      max_turns:
        description: 'Max conversation turns per package fix'
        required: false
        type: number
        default: 75
      show_full_output:
        description: 'Show full JSON output from Claude Code. WARNING: may expose secrets in logs.'
        required: false
        type: boolean
        default: false
      repository_owner:
        description: 'Expected repository owner for guard condition'
        required: false
        type: string
        default: 'viamrobotics'
      alert_severity:
        description: 'Comma-separated severity filter. API values: critical,high,medium,low (note: "medium" shows as "moderate" in the GitHub UI)'
        required: false
        type: string
        default: 'critical,high,medium'
      container:
        description: 'Container image for the fix job (e.g., "ubuntu:22.04"). Leave empty for bare runner.'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      CI_GITHUB_APP_ID:
        required: true
      CI_GITHUB_APP_PRIVATE_KEY:
        required: true
      SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL:
        required: false
      AUTH_TEST_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  collect-alerts:
    if: github.repository_owner == inputs.repository_owner
    permissions:
      issues: write
    runs-on: ubuntu-latest
    outputs:
      fix_matrix: ${{ steps.create-issues.outputs.fix_matrix }}
      rebase_matrix: ${{ steps.create-issues.outputs.rebase_matrix }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        # actions/create-github-app-token@v2.2.1
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        with:
          app-id: ${{ secrets.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}

      - name: Fetch open Dependabot alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SEVERITY_FILTER: ${{ inputs.alert_severity }}
        run: |
          if ! gh api --paginate \
            "/repos/${GH_REPO}/dependabot/alerts?state=open&per_page=100" \
            --jq '.' > /tmp/gh-api-raw.json 2>/tmp/gh-api-err.txt; then
            echo "::error::Failed to fetch Dependabot alerts. Ensure the GitHub App has Dependabot alerts:read permission."
            cat /tmp/gh-api-err.txt >&2
            exit 1
          fi
          ALERTS=$(jq -s 'add // []' /tmp/gh-api-raw.json)

          IFS=',' read -ra SEVS <<< "$SEVERITY_FILTER"
          SEVERITY_JQ=$(printf '"%s",' "${SEVS[@]}")
          SEVERITY_JQ="[${SEVERITY_JQ%,}]"
          FILTERED=$(echo "$ALERTS" | jq --argjson sevs "$SEVERITY_JQ" \
            '[.[] | select(.security_advisory.severity as $s | $sevs | index($s))]')

          ALERT_COUNT=$(echo "$FILTERED" | jq 'length')
          echo "Found ${ALERT_COUNT} open alerts matching severity filter: ${SEVERITY_FILTER}"

          echo "$FILTERED" > /tmp/dependabot-alerts.json

      - name: Group alerts by package
        run: |
          ALERT_COUNT=$(jq 'length' /tmp/dependabot-alerts.json)
          if [ "$ALERT_COUNT" -eq 0 ]; then
            echo "No alerts to process."
            echo "[]" > /tmp/per-package.json
            exit 0
          fi

          # Group by package name, collect all advisories per package
          jq '
            group_by(.security_vulnerability.package.name) |
            map({
              package: .[0].security_vulnerability.package.name,
              ecosystem: .[0].security_vulnerability.package.ecosystem,
              advisories: (
                group_by(.security_advisory.ghsa_id) |
                map({
                  ghsa_id: .[0].security_advisory.ghsa_id,
                  cve_id: (.[0].security_advisory.cve_id // "N/A"),
                  severity: .[0].security_advisory.severity,
                  summary: .[0].security_advisory.summary,
                  vulnerable_range: .[0].security_vulnerability.vulnerable_version_range,
                  patched_version: (.[0].security_vulnerability.first_patched_version.identifier // "no fix available"),
                  alert_numbers: [.[].number],
                  manifest_paths: [.[].dependency.manifest_path] | unique
                })
              ),
              all_manifest_paths: [.[].dependency.manifest_path] | unique,
              max_severity: (
                [.[].security_advisory.severity] |
                map(if . == "critical" then 0 elif . == "high" then 1 elif . == "medium" then 2 else 3 end) |
                min |
                if . == 0 then "critical" elif . == 1 then "high" elif . == 2 then "medium" else "low" end
              ),
              alert_count: length
            }) |
            sort_by(
              if .max_severity == "critical" then 0
              elif .max_severity == "high" then 1
              elif .max_severity == "medium" then 2
              else 3 end
            )
          ' /tmp/dependabot-alerts.json > /tmp/per-package.json

          PKG_COUNT=$(jq 'length' /tmp/per-package.json)
          echo "Grouped into ${PKG_COUNT} packages."

      - name: Ensure dependabot-sweep label exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "dependabot-sweep" \
            --repo "$GH_REPO" \
            --description "Consolidated Dependabot vulnerability sweep" \
            --color "0E8A16" \
            --force 2>/dev/null || true

      - name: Create issues per package and build matrix
        id: create-issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PKG_COUNT=$(jq 'length' /tmp/per-package.json)
          if [ "$PKG_COUNT" -eq 0 ]; then
            echo 'fix_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'rebase_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FIX_ENTRIES="[]"
          REBASE_ENTRIES="[]"

          for i in $(seq 0 $((PKG_COUNT - 1))); do
            PKG=$(jq -r ".[$i].package" /tmp/per-package.json)
            SEVERITY=$(jq -r ".[$i].max_severity" /tmp/per-package.json)
            ALERT_COUNT=$(jq -r ".[$i].alert_count" /tmp/per-package.json)
            ECOSYSTEM=$(jq -r ".[$i].ecosystem" /tmp/per-package.json)

            # Sanitize package name for use in branch names (e.g., @types/node -> types-node)
            BRANCH_SUFFIX=$(echo "$PKG" | tr '/@' '-' | sed 's/^-//')

            # Check if an open issue already exists for this package
            EXISTING=$(gh issue list \
              --repo "$GH_REPO" \
              --label "dependabot-sweep" \
              --state open \
              --search "fix(deps): update ${PKG}" \
              --json number \
              --jq '.[0].number // empty' 2>/dev/null || true)

            # Check if an open PR already exists for this package; if it has
            # merge conflicts, we'll route it through the rebase matrix instead
            # of skipping.
            EXISTING_PR_JSON=$(gh pr list \
              --repo "$GH_REPO" \
              --head "claude/dependabot-sweep-${BRANCH_SUFFIX}" \
              --state open \
              --json number,mergeable,headRefName,headRefOid \
              --jq '.[0]' 2>/dev/null || true)

            EXISTING_PR=""
            PR_MERGEABLE=""
            PR_HEAD_REF=""
            PR_HEAD_SHA=""
            if [ -n "$EXISTING_PR_JSON" ] && [ "$EXISTING_PR_JSON" != "null" ]; then
              EXISTING_PR=$(echo "$EXISTING_PR_JSON" | jq -r '.number')
              PR_MERGEABLE=$(echo "$EXISTING_PR_JSON" | jq -r '.mergeable')
              PR_HEAD_REF=$(echo "$EXISTING_PR_JSON" | jq -r '.headRefName')
              PR_HEAD_SHA=$(echo "$EXISTING_PR_JSON" | jq -r '.headRefOid')
            fi

            if [ -n "$EXISTING_PR" ] && [ "$PR_MERGEABLE" != "CONFLICTING" ]; then
              echo "Skipping ${PKG}: open PR #${EXISTING_PR} (mergeable=${PR_MERGEABLE})."
              continue
            fi

            # Build issue body
            {
              echo "## Dependabot Sweep: \`${PKG}\`"
              echo ""
              echo "**Ecosystem:** ${ECOSYSTEM}"
              echo "**Highest severity:** ${SEVERITY}"
              echo "**Total alerts:** ${ALERT_COUNT}"
              echo ""
              echo "### Advisories"
              echo ""
              jq -r ".[$i].advisories[] |
                \"#### \(.severity | ascii_upcase): \(.summary)\n\" +
                \"- **Advisory:** [\(.ghsa_id)](https://github.com/advisories/\(.ghsa_id)) | **CVE:** \(.cve_id)\n\" +
                \"- **Vulnerable range:** \(.vulnerable_range)\n\" +
                \"- **Patched version:** \(.patched_version)\n\" +
                \"- **Alert numbers:** \(.alert_numbers | join(\", \"))\n\" +
                \"- **Affected lockfiles:**\n\" +
                (.manifest_paths | map(\"  - \`\\(.)\`\") | join(\"\n\")) +
                \"\n\"
              " /tmp/per-package.json
              echo ""
              echo "### Raw data"
              echo ""
              echo '```json'
              jq ".[$i]" /tmp/per-package.json
              echo '```'
            } > "/tmp/issue-body-${i}.md"

            TITLE="fix(deps): update ${PKG} (${SEVERITY}, ${ALERT_COUNT} alerts)"

            if [ -n "$EXISTING" ]; then
              ISSUE_NUMBER="$EXISTING"
              gh issue edit "$ISSUE_NUMBER" \
                --repo "$GH_REPO" \
                --title "$TITLE" \
                --body-file "/tmp/issue-body-${i}.md"
              echo "Updated issue #${ISSUE_NUMBER} for ${PKG}"
            else
              ISSUE_URL=$(gh issue create \
                --repo "$GH_REPO" \
                --title "$TITLE" \
                --body-file "/tmp/issue-body-${i}.md" \
                --label "dependabot-sweep")
              ISSUE_NUMBER="${ISSUE_URL##*/}"
              echo "Created issue #${ISSUE_NUMBER} for ${PKG}"
            fi

            if [ "$PR_MERGEABLE" = "CONFLICTING" ]; then
              echo "PR #${EXISTING_PR} for ${PKG} has conflicts; routing to rebase matrix."
              REBASE_ENTRIES=$(echo "$REBASE_ENTRIES" | jq \
                --arg pkg "$PKG" \
                --arg issue "$ISSUE_NUMBER" \
                --arg severity "$SEVERITY" \
                --arg branch "$BRANCH_SUFFIX" \
                --arg pr "$EXISTING_PR" \
                --arg head_ref "$PR_HEAD_REF" \
                --arg head_sha "$PR_HEAD_SHA" \
                '. + [{"package": $pkg, "issue_number": $issue, "severity": $severity, "branch_suffix": $branch, "pr_number": $pr, "head_ref": $head_ref, "head_sha": $head_sha}]')
            else
              FIX_ENTRIES=$(echo "$FIX_ENTRIES" | jq \
                --arg pkg "$PKG" \
                --arg issue "$ISSUE_NUMBER" \
                --arg severity "$SEVERITY" \
                --arg branch "$BRANCH_SUFFIX" \
                '. + [{"package": $pkg, "issue_number": $issue, "severity": $severity, "branch_suffix": $branch}]')
            fi
          done

          FIX_MATRIX=$(echo "$FIX_ENTRIES" | jq -c '{include: .}')
          REBASE_MATRIX=$(echo "$REBASE_ENTRIES" | jq -c '{include: .}')
          echo "fix_matrix=${FIX_MATRIX}" >> "$GITHUB_OUTPUT"
          echo "rebase_matrix=${REBASE_MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Fix matrix: ${FIX_MATRIX}"
          echo "Rebase matrix: ${REBASE_MATRIX}"

  fix-dependencies:
    needs: collect-alerts
    if: needs.collect-alerts.outputs.fix_matrix != '{"include":[]}' && needs.collect-alerts.outputs.fix_matrix != ''
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    container: ${{ inputs.container || '' }}
    strategy:
      matrix: ${{ fromJSON(needs.collect-alerts.outputs.fix_matrix) }}
      fail-fast: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        # actions/create-github-app-token@v2.2.1
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        with:
          app-id: ${{ secrets.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      # Use actions/github-script instead of gh CLI because this job may
      # run inside a caller-provided container where gh is not available.
      # JavaScript actions always execute on the host runner.
      - name: Get issue body
        id: issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ matrix.issue_number }}')
            });
            core.setOutput('body', issue.body || '');

      - name: Assemble system prompt
        env:
          EXTRA_SYSTEM_PROMPT: ${{ inputs.extra_system_prompt }}
        run: |
          {
            echo "You are resolving Dependabot security vulnerabilities for a single package. Be precise and thorough."
            echo ""
            echo "## Critical: Action-First Approach"
            echo "- ALWAYS try the update command first. Do NOT spend turns investigating compatibility before attempting the update."
            echo "- If the update command fails, read the error message carefully — it will tell you what the conflict is."
            echo "- If a tool call is denied, do NOT retry the same tool or variations of it. Move on to a different approach immediately."
            echo "- You have a limited number of turns. Do not waste them on denied tool calls."
            echo ""
            echo "## Tool Usage"
            echo "- Use Grep, Glob, and Read tools for file searching and reading — do not use Bash for these."
            echo "- You MUST Read every file before you Edit it."
            echo "- Do NOT use: curl, WebFetch, or WebSearch. These are not available."
            echo ""
            echo "## Dependency Sweep Rules"
            echo "- Run the appropriate install/lock commands in each affected directory to regenerate lockfiles."
            echo "- Do NOT add or update tests unless a code change is required to fix a breaking API change."
            echo "- Implement the minimal change. No refactors or unnecessary additions."
            echo "- Follow existing patterns. No new conventions or abstractions."
            echo ""
            echo "## Transitive Dependency Rules (CRITICAL)"
            echo "- NEVER add a transitive dependency as a direct/explicit dependency in the manifest file (go.mod, package.json, etc.)."
            echo "- If the vulnerable package is NOT already a direct dependency in the manifest, it is transitive — fix it by updating the PARENT dependency that pulls it in."
            echo "- Use the advisory's patched_version to determine the MINIMUM parent version that pulls in the fix. Do NOT blindly update the parent to @latest — find the lowest version of the parent that depends on the patched transitive version."
            echo "- To identify which direct dependency pulls in the vulnerable transitive package:"
            echo "  - Go: run 'go mod graph | grep <vulnerable-package>'"
            echo "  - npm: run 'npm ls <vulnerable-package>'"
            echo "  - Python: run 'pip show <vulnerable-package>' or check pipdeptree"
            echo "- For Go: update the parent with 'go get <parent-package>@<minimum-compatible-version>', then 'go mod tidy'. Do NOT run 'go get <transitive-package>' as that adds it to go.mod."
            echo "- For npm: update the parent version in package.json to the minimum version that pulls in the patched transitive, then 'npm install'. Do NOT run 'npm install <transitive-package>'."
            echo "- For Python: update the parent package version constraint in requirements.txt or pyproject.toml, then regenerate the lockfile."
            echo "- After updating, verify the lockfile now contains a version of the vulnerable package that meets or exceeds the patched_version from the advisory."
            echo "- Only update lockfiles (go.sum, package-lock.json, yarn.lock, etc.) — the manifest file should only change if a DIRECT dependency version is being bumped."
            echo "- If no version of the parent dependency pulls in the patched transitive version, as a LAST RESORT you may add the transitive dependency directly to the manifest file. When doing so:"
            echo "  - Add a comment on that line explaining WHY: which advisory (GHSA ID), which parent dependency couldn't resolve it, and that it should be removed once the parent catches up."
            echo "  - Example (Go): '// SECURITY OVERRIDE: pinned for GHSA-xxxx-xxxx — <parent-pkg> does not yet depend on a patched version. Remove when <parent-pkg> updates its dependency.'"
            echo "  - Example (npm package.json): add to the \"overrides\" or \"resolutions\" field with a comment in the PR body explaining the override."
            echo "  - Flag this clearly in the PR description so reviewers know it needs future cleanup."
            echo ""
            echo "## Git Commit Rules"
            echo "- Run git add and git commit as separate commands — never chain with &&."
            echo "- NEVER use HEREDOC or multi-line strings in git commit commands — write the message to /tmp/commit-msg.txt using the Write tool, then run: git commit --file /tmp/commit-msg.txt"
            echo "- For PRs, write the body to a temp file and use --body-file."
            echo "- Write temp files to /tmp/ and do NOT clean them up — runners are ephemeral."
            if [ -n "$EXTRA_SYSTEM_PROMPT" ]; then
              printf '\n%s\n' "$EXTRA_SYSTEM_PROMPT"
            fi
          } > /tmp/ci-system-prompt.md
          {
            echo "APPEND_SYSTEM_PROMPT<<__CI_PROMPT_EOF__"
            cat /tmp/ci-system-prompt.md
            echo "__CI_PROMPT_EOF__"
          } >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@26ddc358fe3befff50c5ec2f80304c90c763f6f8 # v1.0.90
        env:
          AUTH_TEST_CREDENTIALS: ${{ secrets.AUTH_TEST_CREDENTIALS }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: ${{ inputs.show_full_output }}
          display_report: true
          settings: .claude/settings.ci.json
          prompt: |
            You are fixing Dependabot security vulnerabilities for the package `${{ matrix.package }}`.
            This is tracked in issue #${{ matrix.issue_number }}.

            ## Issue Details

            ${{ steps.issue.outputs.body }}

            ## Instructions

            1. Read CLAUDE.md for repository conventions.

            2. Look at the "Raw data" JSON in the issue above. It contains:
               - `advisories`: each advisory with `patched_version` and `manifest_paths`
               - `all_manifest_paths`: every lockfile/manifest affected by this package

            3. For each affected manifest path:
               a. Navigate to the directory containing the lockfile.
               b. First, check if `${{ matrix.package }}` is a DIRECT dependency (listed explicitly in go.mod, package.json, etc.) or a TRANSITIVE dependency (only in the lockfile, pulled in by another package).
               c. If it is a DIRECT dependency: run the appropriate update command to bump it to the patched version.
               d. If it is a TRANSITIVE dependency:
                  - Identify which direct dependency pulls it in (e.g., `go mod graph | grep <pkg>`, `npm ls <pkg>`).
                  - Use the `patched_version` from the advisory to find the minimum version of the parent that includes the fix — do NOT jump to @latest.
                  - Update the parent to that minimum compatible version instead. NEVER add a transitive dependency to the manifest file.
                  - If no parent version resolves the transitive vulnerability, as a last resort add the transitive dependency directly with a comment explaining why (advisory ID, which parent couldn't resolve it, when to remove it).
               e. After updating, regenerate the lockfile (e.g., `go mod tidy`, `npm install`).
               f. If the update fails due to a dependency conflict, investigate that specific constraint and find the best resolution — but still do NOT promote transitive dependencies to direct ones.

            4. After updating, run any available build/lint/typecheck commands to verify nothing is broken.

            5. No-op guard — BEFORE any git branch/commit/push/PR commands:
               - Run `git status --porcelain`. If the output is empty, there are no changes to commit.
               - In that case, do NOT create a branch, do NOT commit, do NOT push, and do NOT open a PR.
               - Instead, comment on issue #${{ matrix.issue_number }} explaining why no changes were needed (e.g., the package is already at or above the patched version transitively, or the advisory does not apply to how this repo uses the package), and stop.

            6. Git workflow (only if step 5 found changes):
               a. Create a branch named `claude/dependabot-sweep-${{ matrix.branch_suffix }}`.
               b. Commit all changes with a clear message.
               c. Push the branch.
               d. Open a PR titled: "fix(deps): update ${{ matrix.package }} (${{ matrix.severity }})"
               e. The PR body MUST include:
                  - The advisories resolved (GHSA IDs)
                  - The lockfiles modified
                  - Any alerts that could NOT be resolved, with an explanation
                  - "Resolves #${{ matrix.issue_number }}"

            7. If the package has no available fix (`patched_version` is "no fix available"):
               - Do NOT force-remove or break the dependency.
               - Note it clearly in the PR description (if a PR is opened) or in the issue comment (if step 5 short-circuited).
               - Comment on issue #${{ matrix.issue_number }} explaining why it cannot be fixed.
            ${{ inputs.extra_prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"

      - name: Build failure comment body
        if: failure()
        id: failure-comment
        env:
          PACKAGE: ${{ matrix.package }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXEC_LOG="/home/runner/work/_temp/claude-execution-output.json"
          DETAILS=""
          if [ -f "$EXEC_LOG" ]; then
            SUBTYPE=$(jq -r '.subtype // "unknown"' "$EXEC_LOG" 2>/dev/null || echo "unknown")
            NUM_TURNS=$(jq -r '.num_turns // "?"' "$EXEC_LOG" 2>/dev/null || echo "?")
            COST=$(jq -r '.total_cost_usd // "?"' "$EXEC_LOG" 2>/dev/null || echo "?")
            DENIALS=$(jq -r '.permission_denials | length // 0' "$EXEC_LOG" 2>/dev/null || echo "0")
            DETAILS=$(cat <<TABLE_EOF

          | Detail | Value |
          |--------|-------|
          | Failure reason | \`${SUBTYPE}\` |
          | Turns used | ${NUM_TURNS} |
          | Permission denials | ${DENIALS} |
          | Cost | \$${COST} |
          TABLE_EOF
            )
          fi

          {
            echo "body<<__FAILURE_COMMENT_EOF__"
            echo "**Sweep failed for \`${PACKAGE}\`**"
            echo ""
            echo "The automated fix attempt did not complete successfully."
            echo "${DETAILS}"
            echo ""
            echo "[View workflow run](${RUN_URL})"
            echo "__FAILURE_COMMENT_EOF__"
          } >> "$GITHUB_OUTPUT"

      # Use actions/github-script instead of gh CLI because this job may
      # run inside a caller-provided container where gh is not available.
      - name: Comment failure details on issue
        if: failure() && steps.failure-comment.outputs.body != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ matrix.issue_number }}'),
              body: `${{ steps.failure-comment.outputs.body }}`
            });

      - name: Notify Slack of failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Dependabot Sweep failed for ${{ github.repository }} (package: ${{ matrix.package }})\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL }}


  # Auto-rebase: any sweep PR that develops merge conflicts is delegated to
  # the rebase-job reusable, which replays the original manifest patch onto
  # the default branch (deterministic) and falls back to Claude only if the
  # manifest itself moved.
  rebase-dependencies:
    needs: collect-alerts
    if: needs.collect-alerts.outputs.rebase_matrix != '{"include":[]}' && needs.collect-alerts.outputs.rebase_matrix != ''
    strategy:
      matrix: ${{ fromJSON(needs.collect-alerts.outputs.rebase_matrix) }}
      fail-fast: false
    uses: viamrobotics/claude-ci-workflows/.github/workflows/claude-dependabot-sweep-rebase-job.yml@main
    with:
      package: ${{ matrix.package }}
      severity: ${{ matrix.severity }}
      issue_number: ${{ matrix.issue_number }}
      pr_number: ${{ matrix.pr_number }}
      head_ref: ${{ matrix.head_ref }}
      head_sha: ${{ matrix.head_sha }}
      install_command: ${{ inputs.install_command }}
      extra_prompt: ${{ inputs.extra_prompt }}
      extra_system_prompt: ${{ inputs.extra_system_prompt }}
      model: ${{ inputs.model }}
      max_turns: ${{ inputs.max_turns }}
      show_full_output: ${{ inputs.show_full_output }}
      allowed_tools: ${{ inputs.allowed_tools }}
      container: ${{ inputs.container }}
    secrets: inherit
