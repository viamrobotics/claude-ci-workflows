name: Claude PR Fix (Reusable)

# Applies fixes to a PR when triggered by @claude-fix in a PR comment.
# Pushes code to the PR branch — this is NOT a read-only review.
#
# Callers handle issue_comment / pull_request_review_comment triggers.
# The github context is inherited from the caller, so trigger_phrase works correctly.

on:
  workflow_call:
    inputs:
      # --- Required ---
      allowed_tools:
        description: 'Allowed tools string for claude-code-action (must include write tools)'
        required: true
        type: string
      # --- Optional ---
      install_command:
        description: 'Command to install dependencies (e.g., "npm ci" or "make install")'
        required: false
        type: string
        default: ''
      extra_prompt:
        description: 'Extra instructions appended to the Claude prompt (user message)'
        required: false
        type: string
        default: ''
      extra_system_prompt:
        description: 'Extra instructions appended to the CI system prompt file'
        required: false
        type: string
        default: ''
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-sonnet-4-6'
      max_turns:
        description: 'Max conversation turns'
        required: false
        type: number
        default: 30
      show_full_output:
        description: 'Show full JSON output from Claude Code. WARNING: may expose secrets in logs.'
        required: false
        type: boolean
        default: false
      repository_owner:
        description: 'Expected repository owner for guard condition'
        required: false
        type: string
        default: 'viamrobotics'
      container:
        description: 'Container image for the job (e.g., "ubuntu:22.04"). Leave empty for bare runner.'
        required: false
        type: string
        default: ''
    secrets:
      # Set at viamrobotics org level. Key: claude_code_key_jira_github_action
      # in the Internal Usage Workspace on Claude Console.
      ANTHROPIC_API_KEY:
        required: true
      GIT_ACCESS_TOKEN:
        required: true
      AUTH_TEST_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  resolve-pr:
    if: github.repository_owner == inputs.repository_owner
    permissions:
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.setFailed('pr-fix only works on pull request comments.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              core.setOutput('ref', pr.head.ref);
              core.setOutput('pr_number', String(pr.number));
            } else {
              core.setOutput('ref', context.payload.pull_request.head.ref);
              core.setOutput('pr_number', String(context.payload.pull_request.number));
            }

      # Fetch failure logs on this bare runner (not inside the caller's
      # container) so that the gh CLI is always available.
      # Logs are uploaded as an artifact and downloaded in pr-fix to avoid
      # ARG_MAX limits when passing large logs through job outputs / env vars.
      - name: Get failure logs
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.pr.outputs.ref }}
        run: |
          set -euo pipefail
          RESOLVED_RUN_ID=$(gh run list \
            --branch "$PR_BRANCH" \
            --repo "$GH_REPO" \
            --status failure \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -z "$RESOLVED_RUN_ID" ]; then
            echo "No recent CI failures found." > /tmp/failure-logs.txt
            exit 0
          fi
          LOGS=$(gh run view "$RESOLVED_RUN_ID" --repo "$GH_REPO" --log-failed 2>&1 | tail -500) || true
          if [ -z "$LOGS" ]; then
            LOGS=$(gh run view "$RESOLVED_RUN_ID" --repo "$GH_REPO" --log 2>&1 | tail -500) || true
          fi
          if [ -z "$LOGS" ]; then
            LOGS="No recent CI failures found."
          fi
          # Sanitize GitHub Actions log markers
          LOGS="${LOGS//##\[/\[}"
          echo "$LOGS" > /tmp/failure-logs.txt

      - name: Upload failure logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: failure-logs
          path: /tmp/failure-logs.txt
          retention-days: 1

  pr-fix:
    needs: resolve-pr
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    container: ${{ inputs.container || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-pr.outputs.ref }}
          fetch-depth: 1
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: Download failure logs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: failure-logs
          path: /tmp

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Resolve reusable workflow ref
        id: workflow-ref
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: echo "ref=${WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout CI prompts and scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: viamrobotics/claude-ci-workflows
          ref: ${{ steps.workflow-ref.outputs.ref }}
          path: .ci-prompts
          sparse-checkout: |
            prompts/
            scripts/
          sparse-checkout-cone-mode: false

      - name: Assemble CI system prompt
        env:
          SYSTEM_PROMPT_PREAMBLE: "You are fixing a pull request based on reviewer feedback. Be precise and make minimal changes."
          EXTRA_SYSTEM_PROMPT: ${{ inputs.extra_system_prompt }}
        run: .ci-prompts/scripts/assemble-system-prompt.sh

      - uses: anthropics/claude-code-action@0cf5eeec4f908121edd03a81411b55485994f8d3 # v1.0.54
        env:
          AUTH_TEST_CREDENTIALS: ${{ secrets.AUTH_TEST_CREDENTIALS }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: ${{ inputs.show_full_output }}
          settings: .claude/settings.ci.json
          trigger_phrase: "@claude-fix"
          track_progress: true
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ needs.resolve-pr.outputs.pr_number }} on branch `${{ needs.resolve-pr.outputs.ref }}`

            You are a senior engineer fixing a pull request based on the commenter's instructions.
            Read their comment carefully — it describes exactly what they want changed.

            ## Setup

            1. Read CLAUDE.md for repository conventions and constraints.
            2. Read every modified file in full to understand the current PR state.
            3. Run `git diff origin/main...HEAD` to see the full set of PR changes.

            ## CI Failure Logs

            If the commenter is asking you to fix CI failures, read the logs from `/tmp/failure-logs.txt` to diagnose the issue.

            ## Instructions

            - Focus on the specific changes requested in the comment.
            - Make minimal, targeted fixes that follow existing codebase conventions.
            - After making changes, run any relevant linters or tests to verify correctness.
            - Commit and push your changes to the PR branch.
            - Post a brief summary of what you changed as a PR comment.
            ${{ inputs.extra_prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"
