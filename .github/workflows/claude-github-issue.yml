name: Claude GitHub Issue Implementation (Reusable)

# Implements a GitHub issue using Claude Code Action.
# Creates a branch with claude/ prefix, opens a PR, notifies Slack on failure.
#
# Callers handle triggers (issues opened/labeled) and pass issue data directly.

on:
  workflow_call:
    inputs:
      # --- Required ---
      issue_number:
        description: 'GitHub issue number'
        required: true
        type: number
      title:
        description: 'Issue title'
        required: true
        type: string
      body:
        description: 'Issue body/description'
        required: true
        type: string
      allowed_tools:
        description: 'Allowed tools string for claude-code-action'
        required: true
        type: string
      issue_author:
        description: 'GitHub username of the issue reporter (assigned to the resulting PR)'
        required: false
        type: string
        default: ''
      # --- Optional ---
      install_command:
        description: 'Command to install dependencies (e.g., "npm ci" or "make install")'
        required: false
        type: string
        default: ''
      extra_prompt:
        description: 'Extra instructions appended to the Claude prompt (user message)'
        required: false
        type: string
        default: ''
      extra_system_prompt:
        description: 'Extra instructions appended to the CI system prompt file'
        required: false
        type: string
        default: ''
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'claude-opus-4-6'
      task_complexity:
        description: 'Task complexity: small (50 turns), medium (75), large (100). Ignored if max_turns is set.'
        required: false
        type: string
        default: 'small'
      max_turns:
        description: 'Max conversation turns (overrides task_complexity if > 0)'
        required: false
        type: number
        default: 0
      show_full_output:
        description: 'Show full JSON output from Claude Code. WARNING: may expose secrets in logs.'
        required: false
        type: boolean
        default: false
      repository_owner:
        description: 'Expected repository owner for guard condition'
        required: false
        type: string
        default: 'viamrobotics'
      container:
        description: 'Container image for the implement job (e.g., "ubuntu:22.04"). Leave empty for bare runner.'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL:
        required: false
      AUTH_TEST_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      max_turns: ${{ steps.resolve.outputs.max_turns }}
    steps:
      - name: Map task complexity to max turns
        id: resolve
        env:
          MAX_TURNS: ${{ inputs.max_turns }}
          COMPLEXITY: ${{ inputs.task_complexity }}
        run: |
          if [ "$MAX_TURNS" -gt 0 ] 2>/dev/null; then
            echo "max_turns=$MAX_TURNS" >> "$GITHUB_OUTPUT"
          else
            case "$COMPLEXITY" in
              medium) echo "max_turns=150" >> "$GITHUB_OUTPUT" ;;
              large)  echo "max_turns=200" >> "$GITHUB_OUTPUT" ;;
              *)      echo "max_turns=100" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  implement:
    needs: resolve-inputs
    if: github.repository_owner == inputs.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    container: ${{ inputs.container || '' }}
    steps:
      - name: Comment on issue that implementation is starting
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "🤖 Claude is starting work on this issue. [Follow progress]($RUN_URL)"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Checkout CI prompts and scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: viamrobotics/claude-ci-workflows
          ref: main
          path: .ci-prompts
          sparse-checkout: |
            prompts/
            scripts/
          sparse-checkout-cone-mode: false

      - name: Assemble CI system prompt
        env:
          SYSTEM_PROMPT_PREAMBLE: "Before modifying any file, explore the relevant code first."
          EXTRA_SYSTEM_PROMPT: ${{ inputs.extra_system_prompt }}
        run: .ci-prompts/scripts/assemble-system-prompt.sh

      - id: claude
        uses: anthropics/claude-code-action@26ddc358fe3befff50c5ec2f80304c90c763f6f8 # v1.0.90
        env:
          AUTH_TEST_CREDENTIALS: ${{ secrets.AUTH_TEST_CREDENTIALS }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: ${{ inputs.show_full_output }}
          display_report: true
          settings: .claude/settings.ci.json
          prompt: |
            Implement the following GitHub issue:

            Issue: #${{ inputs.issue_number }}
            Title: ${{ inputs.title }}
            Description:
            ${{ inputs.body }}

            Instructions:
            - Read CLAUDE.md for repository conventions.
            - Add or update unit tests for changed behavior.
            - Branch name MUST start with `claude/` prefix.
            - Before creating a branch, committing, or pushing, run `git status --porcelain`. If the output is empty, do NOT create a branch — comment on issue #${{ inputs.issue_number }} explaining why no changes were needed and stop.
            - To open the PR: commit, push the `claude/` branch, then write the PR title to /tmp/pr-title.txt (include the issue reference, e.g. `feat: implement feature (#${{ inputs.issue_number }})`) and the PR body to /tmp/pr-body.txt (link the issue with `Closes #${{ inputs.issue_number }}`). Do NOT run `gh pr create` — the workflow opens the PR from those files.
            ${{ inputs.issue_author != '' && format('- In /tmp/pr-body.txt, include a "DRI" section: **@{0}** is the responsible engineer for this PR.', inputs.issue_author) || '' }}
            ${{ inputs.extra_prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ needs.resolve-inputs.outputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"

      # Keep the execution log so no-PR outcomes are debuggable after teardown.
      - name: Upload Claude execution output
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: claude-execution-output
          # Use the action's output path; fall back to the temp location
          # (container-safe). A blank line is skipped if the output is empty.
          path: |
            ${{ steps.claude.outputs.execution_file }}
            ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 7

      # Open the PR deterministically: the agent pushes the branch and writes
      # the title/body to /tmp; it never runs `gh pr create` (the Bash matcher
      # rejects multi-line args), which also yields the PR URL directly.
      - name: Open PR
        id: open-pr
        if: steps.claude.outcome == 'success'
        env:
          # Same token the action used (Claude app token if available) so the PR
          # is authored identically and triggers CI exactly as the agent's would.
          GH_TOKEN: ${{ steps.claude.outputs.github_token || github.token }}
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
        run: |
          if [ ! -f /tmp/pr-title.txt ]; then
            echo "No /tmp/pr-title.txt: agent did not request a PR."
            exit 0
          fi
          [ -f /tmp/pr-body.txt ] || : > /tmp/pr-body.txt
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          fi
          TITLE=$(cat /tmp/pr-title.txt)
          # Idempotent on re-runs: reuse an open PR for this exact branch.
          PR_URL=$(gh pr list --state open --head "$BRANCH_NAME" --json url --jq '.[0].url // empty' 2>/dev/null || true)
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --head "$BRANCH_NAME" --title "$TITLE" --body-file /tmp/pr-body.txt)
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "PR: $PR_URL"

      - name: Assign issue reporter to PR
        if: inputs.issue_author != '' && steps.open-pr.outputs.pr_url != ''
        env:
          ISSUE_AUTHOR: ${{ inputs.issue_author }}
          PR_URL: ${{ steps.open-pr.outputs.pr_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "$PR_URL" --add-assignee "$ISSUE_AUTHOR"
          echo "Assigned $ISSUE_AUTHOR to $PR_URL"

      - name: Comment result on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          PR_URL: ${{ steps.open-pr.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CLAUDE_OUTCOME" != "success" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "❌ Claude failed to implement this issue. [View logs]($RUN_URL)"
          elif [ -n "$PR_URL" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "✅ Claude opened a PR for this issue: $PR_URL"
          else
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "⚠️ Claude completed but did not open a PR. This may mean the issue requires manual intervention or Claude could not determine a code change. [View logs]($RUN_URL)"
          fi

      - name: Notify Slack of failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Claude GitHub issue implementation failed for ${{ github.repository }} #${{ inputs.issue_number }}: ${{ inputs.title }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL }}
